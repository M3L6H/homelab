- name: base
  hosts: shinobu
  become: yes # Run as sudo
  vars:
    main_user: m3l6h
    ssh_port: 7272
  tasks:
    # ==================================================================
    # update & install packages
    # ==================================================================
    - name: Update all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - apt-listchanges
          - fail2ban
          - iptables
          - needrestart
          - ufw
          - unattended-upgrades
        state: present
    # ==================================================================
    # set up automatic security upgrades
    # ==================================================================
    - name: Enable automatic security updates
      command: dpkg-reconfigure -f noninteractive unattended-upgrades
      changed_when: false
    - name: Ensure unattended-upgrades is configured for security only
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        content: |-
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
        mode: "0644"
    # ==================================================================
    # harden ssh
    # ==================================================================
    - name: Configure SSH - change port and harden
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - {regexp: '^#?Port ', line: "Port {{ ssh_port }}"}
        - {regexp: '^#?PermitRootLogin ', line: "PermitRootLogin no"}
        - {regexp: '^#?PasswordAuthentication ', line: "PasswordAuthentication no"}
        - {regexp: '^#?PubkeyAuthentication ', line: "PubkeyAuthentication yes"}
        - {regexp: '^#?X11Forwarding ', line: "X11Forwarding no"}
        - {regexp: '^#?MaxAuthTries ', line: "MaxAuthTries 3"}
        - {regexp: '^#?ClientAliveInterval ', line: "ClientAliveInterval 300"}
        - {regexp: '^#?ClientAliveCountMax ', line: "ClientAliveCountMax 2"}
        - {regexp: '^#?AllowTcpForwarding ', line: "AllowTcpForwarding no"}
      notify: Restart ssh
    - name: Restrict SSH to specific users
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowUsers '
        line: "AllowUsers {{ main_user }}"
        state: present
      notify: Restart ssh
    # ==================================================================
    # set up firewall
    # ==================================================================
    - name: Configure firewall (UFW) - deny incoming by default
      community.general.ufw:
        default: deny
        direction: incoming
    - name: Configure firewall (UFW) - allow outgoing by default
      community.general.ufw:
        default: allow
        direction: outgoing
    - name: Configure firewall (UFW) - allow SSH port
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        comment: "SSH on custom port"
    - name: Enable UFW
      community.general.ufw:
        state: enabled
    # ==================================================================
    # set up fail2ban
    # ==================================================================
    - name: Configure Fail2Ban for the SSH port
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 3
          bantime = 1h
          findtime = 10m
        mode: "0644"
      notify: Restart fail2ban
    - name: Ensure Fail2Ban is started and enabled
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
    # ==================================================================
    # disable unused network services
    # ==================================================================
    - name: Disable unused network services if present
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - bluetooth
        - cups
        - avahi-daemon
      failed_when: false # ignore if the service does not exist
    # ==================================================================
    # update umask
    # ==================================================================
    - name: Set a reasonable umask in /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^UMASK'
        line: "UMASK           027"
        state: present
  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
